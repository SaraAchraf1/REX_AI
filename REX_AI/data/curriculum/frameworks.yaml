  - framework_id: EG-NAQAAE-PS
    name: NAQAAE program specification requirements (Egypt) — design checklist
    short_name: NAQAAE program specification
    aliases: [naqaae, egypt accreditation, national authority for quality assurance, الهيئة القومية لضمان جودة التعليم والاعتماد]
    country: EG
    source_id: SRC-EG-NAQAAE
    url: https://naqaae.eg/en/higher_education/publications_templates
    last_checked: 2026-10-24
    applies_to: [egypt]
    note: Team checklist derived from the program/course specification template (aims, intended learning outcomes
          in four categories, teaching and assessment methods). Verify against the current NAQAAE template.
    competencies:
      - {id: NAQ-AIMS, kind: structure, check: has_objectives, name: Program aims / objectives are stated}
      - {id: NAQ-ILO-K, kind: structure, check: "outcome_domain:knowledge", name: "ILOs: knowledge and understanding"}
      - {id: NAQ-ILO-I, kind: structure, check: "outcome_domain:intellectual", name: "ILOs: intellectual skills"}
      - {id: NAQ-ILO-P, kind: structure, check: "outcome_domain:practical", name: "ILOs: professional and practical skills"}
      - {id: NAQ-ILO-G, kind: structure, check: "outcome_domain:transferable", name: "ILOs: general and transferable skills"}
      - {id: NAQ-TL, kind: structure, check: has_practical_work, name: Teaching and learning methods include practical work}
      - {id: NAQ-ASSESS, kind: structure, check: assessments_complete, name: Assessment methods with weights that total 100%}
      - {id: NAQ-STRUCT, kind: structure, check: hours_consistent, name: Course structure with contact hours per module}
      - {id: NAQ-PREREQ, kind: structure, check: has_prerequisites, name: Prerequisites / admission requirements stated}

  - framework_id: SA-NQF-DOMAINS
    name: Saudi National Qualifications Framework (NQF-KSA) learning domains — design checklist
    short_name: NQF-KSA learning domains
    aliases: [nqf-ksa, saudi nqf, ncaaa, nctea, etec, saudi accreditation, الإطار الوطني للمؤهلات]
    country: SA
    source_id: SRC-SA-ETEC-NCAAA
    url: https://etec.gov.sa/en/service/Program%20Accreditation/servicedocuments
    last_checked: 2026-10-24
    applies_to: [saudi arabia]
    note: Team checklist using the three NQF-KSA learning-outcome domains plus basic training-program design items.
          Training-provider accreditation in Saudi Arabia is handled by ETEC/NCTEA and TVTC; verify current requirements.
    competencies:
      - {id: NQF-K, kind: structure, check: "outcome_domain:knowledge", name: "Learning outcomes: knowledge and understanding"}
      - {id: NQF-S, kind: structure, check: "outcome_domain:practical", name: "Learning outcomes: skills"}
      - {id: NQF-V, kind: structure, check: "outcome_domain:transferable", name: "Learning outcomes: values, autonomy and responsibility"}
      - {id: NQF-OBJ, kind: structure, check: has_objectives, name: Training objectives are stated}
      - {id: NQF-ASSESS, kind: structure, check: assessments_complete, name: Assessment plan with weights that total 100%}
      - {id: NQF-ALIGN, kind: structure, check: outcomes_assessed, name: Every learning outcome is assessed}
      - {id: NQF-HOURS, kind: structure, check: hours_consistent, name: Training hours declared and consistent}

