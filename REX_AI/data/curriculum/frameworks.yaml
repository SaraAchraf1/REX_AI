# REX AI — Accreditation and competency frameworks used by the Curriculum Agent (owner: Member 2)
#
# Used for ALIGNMENT ONLY. A curriculum that covers every item below is "aligned with" the framework;
# it is never "accredited" or "certified" by it. Only the academy, with evidence from the awarding body,
# may claim accreditation (brief, Agent 3 "Important" rule).
#
# These are TEAM SUMMARIES of public documents (status to_verify): the competency names follow the official
# documents, the keywords are ours. Check each item against the official source before relying on it.
#
# competency kind:
#   topic      covered when the curriculum's modules / topics / exercises mention it (keywords, then semantic match)
#   outcome    covered when a learning outcome addresses it
#   structure  a rule about the curriculum's design, checked by rex_ai/agents/curriculum/alignment.py (check: name)
# filter_by_department: only competencies whose departments include the curriculum's department are compared.

frameworks:
  - framework_id: ISTQB-CTFL-4
    name: ISTQB Certified Tester Foundation Level (CTFL) v4.0
    short_name: ISTQB Foundation
    aliases: [istqb, istqb foundation, ctfl, istqb ctfl]
    country: INTL
    source_id: SRC-INTL-ISTQB
    url: https://www.istqb.org/certifications/certified-tester-foundation-level
    last_checked: 2026-10-24
    exam_prep: true
    applies_to: [software testing, testing, qa, quality assurance, test automation, tester]
    departments: [Software]
    competencies:
      - {id: CTFL-1, kind: topic, name: Fundamentals of testing,
         description: "What testing is, why it is necessary, the testing principles, test activities and roles",
         keywords: [fundamentals of testing, testing principles, test process, test activities, why testing, "مبادئ الاختبار"]}
      - {id: CTFL-2, kind: topic, name: Testing throughout the software development lifecycle,
         description: "Testing in SDLC models, test levels and test types, confirmation and regression testing, maintenance testing",
         keywords: [software development lifecycle, sdlc, test levels, test types, regression testing, maintenance testing, shift-left]}
      - {id: CTFL-3, kind: topic, name: Static testing,
         description: "Static testing basics, work products that can be reviewed, the review process and review types",
         keywords: [static testing, static analysis, review process, code review, reviews]}
      - {id: CTFL-4, kind: topic, name: Test analysis and design,
         description: "Black-box, white-box and experience-based test techniques; collaboration-based test approaches",
         keywords: [test design, test techniques, equivalence partitioning, boundary value, decision table, state transition, black-box, white-box, exploratory testing]}
      - {id: CTFL-5, kind: topic, name: Managing the test activities,
         description: "Test planning, risk management, test monitoring and control, configuration and defect management",
         keywords: [test planning, test management, risk-based testing, test monitoring, defect management, defect report, bug report, test estimation]}
      - {id: CTFL-6, kind: topic, name: Test tools,
         description: "Tool support for testing, benefits and risks of test automation",
         keywords: [test tools, test automation, automation framework, selenium, playwright, cypress, tool support]}

