# REX AI — Industry skill requirements per department (Curriculum Agent, brief FR 19)
#
# SAMPLE: compiled by the team from public job postings in Egypt and Saudi Arabia and occupation profiles
# (ESCO / O*NET, source ids SRC-INTL-ESCO / SRC-INTL-ONET, status to_verify). Replace or extend with the
# academy's labour-market research. The agent uses these lists to add market-demanded topics to a curriculum
# and to suggest the department when the request does not give one.
#
#   keywords      words in a course title that point to this department (English + Arabic)
#   roles         typical job titles the course prepares for
#   core_skills   technical skills employers ask for; used as candidate topics
#   tools         tools and platforms named in job postings
#   soft_skills   transferable skills; used for the general / transferable learning outcomes

_meta:
  source_id: SRC-CUR-INDUSTRY
  status: sample
  last_updated: 2026-10-24

