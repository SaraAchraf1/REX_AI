      - {key: objectives, heading: {en: Training objectives, ar: أهداف التدريب}}
      - {key: participants, heading: {en: Target participants, ar: المشاركون المستهدفون}}
      - {key: outcomes, heading: {en: Expected learning outcomes, ar: نواتج التعلم المتوقعة}}
      - {key: program_table, heading: {en: Proposed programme, ar: البرنامج المقترح}, locked: true}
