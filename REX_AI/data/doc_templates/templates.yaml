# Document templates for Agent 4 - Educational Content & Document Generation (owner: Member 3).
#
# One template per document type (brief, Agent 4 items 26-35). A template fixes the section order and the
# headings in English and Arabic; rex_ai/agents/documents/builders.py fills each section from the curriculum /
# catalogue data. Reorder or delete sections here to change every generated document - no code change needed.
# Add another template for the same type (new template_id, default: false) and pick it with DocumentRequest.template_id.
#
# Section flags:
#   locked: true    facts copied from approved data (hours, fees, schedules, weights). The LLM never rewrites them;
#                   only a reviewer can edit them.
#
# These are SAMPLE templates written by the team until the academy sends its approved reference documents
# (brief §11). The matching reference examples in references/ are indexed in the shared RAG (collection
# doc_templates) and given to the LLM as style examples.

_meta:
  source_id: SRC-DOC-TEMPLATES
  status: sample
  last_updated: 2026-10-27
  pass_mark_pct: 60              # academy policy used in assessment documents (sample - confirm with the academy)
  attendance_pct: 80
  # Used only when a document is built from a catalogue course that has no curriculum yet (the catalogue lists no
  # assessment plan). The document says so; generate and approve a curriculum for the real plan.
  default_assessments:
    - {name: {en: Module quizzes, ar: اختبارات قصيرة لكل وحدة}, type: quiz, weight_pct: 20}
    - {name: {en: Practical assignments and labs, ar: تكليفات ومعامل عملية}, type: assignment, weight_pct: 40}
    - {name: {en: Capstone project and presentation, ar: المشروع الختامي والعرض}, type: project, weight_pct: 40}

templates:
  - template_id: TPL-COURSE-DESC-V1
    doc_type: course_description
    default: true
    title: {en: Course Description, ar: وصف الدورة}
    reader: {en: Prospective learners and sales, ar: المتدربون المحتملون وفريق المبيعات}
    description: One- to two-page public description of the course for the website, brochures and sales.
    sections:
      - {key: overview, heading: {en: Course overview, ar: نظرة عامة على الدورة}}
      - {key: audience, heading: {en: Who should attend, ar: الفئة المستهدفة}}
      - {key: prerequisites, heading: {en: Prerequisites, ar: المتطلبات السابقة}}
      - {key: outcomes, heading: {en: What you will learn, ar: ماذا ستتعلم}}
      - {key: content_table, heading: {en: Course content, ar: محتوى الدورة}, locked: true}
      - {key: format, heading: {en: Duration and training format, ar: المدة وأسلوب التدريب}, locked: true}
      - {key: instructors, heading: {en: Instructors, ar: المدربون}, locked: true}
      - {key: fees, heading: {en: Fees and current offers, ar: الرسوم والعروض الحالية}, locked: true}
      - {key: certificate, heading: {en: Certificate, ar: الشهادة}}
      - {key: careers, heading: {en: Career opportunities, ar: الفرص الوظيفية}}

