# REX AI — Initial data source registry (Sprint 1)
# Every record the agents store must reference a source_id from this file
# (brief §2: "all generated outputs are traceable to appropriate source data").
#
# status:   approved  = cleared for use by the agents
#           sample    = placeholder created by the team; replace with academy-approved data
#           to_verify = candidate source; check access, terms of use and robots.txt before automating
# access:   file | portal_manual | portal_scrape | api | rss

internal:
  - source_id: SRC-ACAD-COURSES
    name: Academy course catalogue (titles, descriptions, outcomes, metadata)
    owner: Member 1
    used_by: [rex_assistant, curriculum, document, marketing]
    location: data/courses.json
    access: file
    status: sample
    note: Replace with the academy's approved catalogue export before the Sprint 2 demo.
  - source_id: SRC-ACAD-INSTRUCTORS
    name: Instructor profiles
    owner: Member 1
    used_by: [rex_assistant, document]
    location: data/instructors.json
    access: file
    status: sample
  - source_id: SRC-ACAD-PRICING
    name: Course fees and current promotions
    owner: Member 1
    used_by: [rex_assistant, marketing]
    location: data/pricing_promotions.json
    access: file
    status: sample
    note: Prices change; every answer that quotes a fee shows the valid_until date.
  - source_id: SRC-ACAD-SCHEDULES
    name: Cohort schedules and training formats
    owner: Member 1
    used_by: [rex_assistant, marketing]
    location: data/schedules.json
    access: file
    status: sample
  - source_id: SRC-ACAD-FAQ
    name: Frequently asked questions (Arabic + English)
    owner: Member 1
    used_by: [rex_assistant]
    location: data/faqs.json
    access: file
    status: sample
  - source_id: SRC-ACAD-ADMISSION
    name: Admission requirements
    owner: Member 1
    used_by: [rex_assistant]
    location: data/admission_requirements.json
    access: file
    status: sample
  - source_id: SRC-ACAD-PROFILE
    name: Academy profile for tender eligibility (registration, experience, certificates, capacity)
    owner: Member 2
    used_by: [rfp_research]
    location: data/rfp/academy_profile.yaml
    access: file
    status: sample
  - source_id: SRC-ACAD-TEMPLATES
    name: Reference document templates (participant guide, facilitator guide, question bank, rubric, proposal...)
    owner: Member 3
    used_by: [document]
    location: data/templates/   # requested from Eslam El Hefny (brief §11)
    access: file
    status: to_verify
    note: Pending from the academy; needed before the Document Agent's template work in Sprint 2.

tenders:
  # Geographic scope is Egypt + Saudi Arabia ONLY (brief, Agent 2 strict rule).
  # The RFP agent (rex_ai/agents/rfp) reads feeds and documents always; the public portals below are fetched
  # only with include_live_sources=true (or --live), after robots.txt allows it.
  - source_id: SRC-RFP-SAMPLE
    name: Sample tender feed (team-made test data, includes out-of-scope and duplicate notices on purpose)
    country: [EG, SA]
    location: data/rfp/feeds/
    owner: Member 2
    used_by: [rfp_research]
    access: file
    status: sample
    note: Replace with real exports. Any JSON / CSV / Excel listing dropped in data/rfp/feeds/ is processed.
  - source_id: SRC-RFP-DOCS
    name: Tender documents (RFP / RFQ / terms of reference files collected by the team)
    country: [EG, SA]
    location: data/rfp/documents/
    owner: Member 2
    used_by: [rfp_research]
    access: file
    status: sample
    note: PDF / Word / TXT files; fields are extracted and every passage is indexed in the RAG collection rfp_docs.
  - source_id: SRC-EG-ETENDERS
    name: Egypt Government e-Procurement Portal
    country: EG
    url: https://etenders.gov.eg/
    owner: Member 2
    access: portal_scrape
    language: ar
    status: to_verify
    note: Official public-sector tenders portal; mainly Arabic. Egypt matches are flagged for immediate review.
  - source_id: SRC-SA-ETIMAD
    name: Etimad (Ministry of Finance) — government competitions/tenders
    country: SA
    url: https://portal.etimad.sa/
    owner: Member 2
    access: portal_manual
    language: ar
    status: to_verify
    note: Viewing tender details and buying RFP documents may need a registered account; start with the public listing.
  - source_id: SRC-SA-HRSD
    name: Ministry of Human Resources and Social Development — tenders page
    country: SA
    url: https://www.hrsd.gov.sa/
    owner: Member 2
    access: portal_scrape
    status: to_verify
  - source_id: SRC-SA-HRDF
    name: HRDF (Human Resources Development Fund) — competitions and purchases
    country: SA
    url: https://hrdf.org.sa/en/about/competitions-and-purchases-1/competitions-and-purchases
    owner: Member 2
    access: portal_scrape
    status: to_verify
    note: Training-focused public buyer; high relevance for the academy.
  - source_id: SRC-INTL-WB
    name: World Bank procurement notices (filter country = Egypt / Saudi Arabia)
    country: [EG, SA]
    url: https://projects.worldbank.org/en/projects-operations/procurement
    owner: Member 2
    access: portal_scrape
    status: to_verify
    note: Donor-funded tenders delivered in Egypt; keep only notices where country is EG or SA.
  - source_id: SRC-INTL-AFDB
    name: African Development Bank procurement (Egypt projects)
    country: EG
    url: https://www.afdb.org/en/projects-and-operations/procurement
    owner: Member 2
    access: portal_scrape
    status: to_verify
  - source_id: SRC-INTL-UNGM
    name: United Nations Global Marketplace (filter country = Egypt / Saudi Arabia)
    country: [EG, SA]
    url: https://www.ungm.org/Public/Notice
    owner: Member 2
    access: portal_scrape
    status: to_verify

